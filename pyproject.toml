[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alt-text-writer"
version = "0.1.0"
description = "Accessibility CLI that finds images missing alt text and drafts descriptive alt text for them."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Asdale Dynamics, LLC" }]
keywords = ["accessibility", "alt-text", "a11y", "html", "markdown"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Accessibility",
]
dependencies = []

[project.scripts]
alt-text-writer = "alt_text_writer.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["alt_text_writer*"]
